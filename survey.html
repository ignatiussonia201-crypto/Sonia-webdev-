<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey Form</title>
  <style>
    body { font-family: serif; padding: 20px; border: 2px solid skyblue; }
    h1 { text-align: center; color: skyblue; }
    input, select { padding: 8px; margin: 5px; }
    button { background: green; color: white; padding: 10px 20px; border: none; }
  </style>
</head>
<body>
  <h1>SURVEY FORM</h1>
  <form>
    <label>Name:</label><br>
    <input type="text" required><br><br>
    
    <label>How did you hear about us?</label><br>
    <input type="radio" name="source"> Facebook<br>
    <input type="radio" name="source"> Instagram<br>
    <input type="radio" name="source"> Friend<br><br>
    
    <label>Rate us:</label><br>
    <select>
      <option>Excellent</option>
      <option>Good</option>
      <option>Fair</option>
    </select><br><br>
    
    <button type="submit">Submit Survey</button>
  </form>
</body>
</html>
